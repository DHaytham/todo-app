<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
  </head>
  <body>
    <main>
      <h1>To-Do App</h1>
      <p>A To-Do app that helps users organise their daily tasks and plan important events</p>
      <h2>Tasks</h2>
      <ul>
        <li>
          <input type="checkbox" id="brush-teeth">
          <label for="brush-teeth">Brush teeth</label>
        </li>
        <li>
          <input type="checkbox" id="breakfast">
          <label for="breakfast">Eat breakfast</label>
        </li>
        <li>
          <input type="checkbox" id="shower">
          <label for="shower">Take a shower</label>
        </li>
      </ul>
    </main>
  </body>
</html>
