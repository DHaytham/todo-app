<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
  </head>
  <body>
    <main>
      <h1>To-Do App</h1>
      <p>A learning project for organising daily tasks, with event planning planned for a future version.</p>
      <form>
        <label for="newTask">New Task</label>
        <input type="text" id="newTask" name="task" placeholder="Prepare lunchbox" required>
        <button type="submit">Add task</button>
      </form>
      <h2>Tasks</h2>
      <ul>
        <li>
          <input type="checkbox" id="brush-teeth">
          <label for="brush-teeth">Brush teeth</label>
        </li>
        <li>
          <input type="checkbox" id="breakfast">
          <label for="breakfast">Eat breakfast</label>
        </li>
        <li>
          <input type="checkbox" id="shower">
          <label for="shower">Take a shower</label>
        </li>
      </ul>
      <a href="about.html">About this app</a>
    </main>
  </body>
</html>
